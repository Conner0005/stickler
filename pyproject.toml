[project]
name = "wetopt"
version = "0.1.0"
description = "Minimal-surfactant spray adjuvant blend optimiser with a no-smaller-blend certificate"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "rdkit>=2026.9.1",
    "rich>=15.0.0",
    "scipy>=1.17.1",
    "streamlit>=1.67.0",
    "typer>=0.28.0",
]

[project.scripts]
wetopt = "wetopt.cli:app"

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# CSS, SVG and HTML templates read better unwrapped.
"src/wetopt/ui.py" = ["E501"]
"src/wetopt/site.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full-library benchmarks (run with -m slow -s)"]
addopts = "-m 'not slow'"
